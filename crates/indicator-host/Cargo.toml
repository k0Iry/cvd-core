[package]
name = "cvd-indicator-host"
description = "Async supervisor/client for cvd-indicator-runner processes"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
cvd-indicator-sdk = { path = "../indicator-sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "rt", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "rt-multi-thread", "macros"] }
