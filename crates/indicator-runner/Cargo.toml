[package]
license.workspace = true
rust-version.workspace = true
name = "cvd-indicator-runner"
description = "Isolated process that loads one operator-configured indicator dynamic library"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "cvd-indicator-runner"
path = "src/main.rs"

[dependencies]
cvd-indicator-sdk = { path = "../indicator-sdk" }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
libc = "0.2"
