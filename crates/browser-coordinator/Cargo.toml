[package]
name = "cvd-browser-coordinator"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Trusted browser-side data/session planner for local CVD WASM plugins (lane B)"

# Self-contained workspace: lane B must not touch A's root workspace/lock
# while lane D runs (PARENT-B-REVIEW §1). E may consolidate later.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cvd-indicator-sdk = { path = "../indicator-sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
