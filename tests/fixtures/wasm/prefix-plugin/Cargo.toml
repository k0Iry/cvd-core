[package]
name = "prefix-indicator"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "PUBLIC generic test fixture (lane B): window-origin-sensitive prefix sum with nonzero context; feature v2 = replacement that rejects odd user `scale`"

# Standalone: never a member of A's frozen root workspace.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
v2 = []

[dependencies]
cvd-indicator-sdk = { path = "../../../../crates/indicator-sdk" }

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
