name: CI
# Run local gates first; CI verifies pushes and pull requests.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Master pushes are serialized in one group. Queue order is NOT a commit-order
# guarantee; the publish step re-checks the upstream master head before :latest.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/master' && 'master-publish' || github.run_id }}
  cancel-in-progress: false
jobs:
  # Shared contracts run ONCE (amd64); images are built natively per arch below.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rust toolchain
        run: rustup show && rustup target add wasm32-unknown-unknown
      # Push/PR launch no browser; manual workflow_dispatch runs the full browser tier.
      - name: Rust workspace + wasm foundation gate (host-owned public fixtures; real Chromium on manual runs only)
        shell: bash
        env:
          BROWSER_MODE: ${{ github.event_name == 'workflow_dispatch' && 'full' || 'none' }}
        run: |
          set +e
          if [ "$BROWSER_MODE" = full ]; then export CVD_CHROMIUM="$(command -v chromium || command -v google-chrome)"; fi
          bash scripts/wasm-foundation-gate.sh --browser="$BROWSER_MODE" "$RUNNER_TEMP/wasm-gate" > "$RUNNER_TEMP/cvd-tests.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/cvd-tests.log"
          if [ "$result" -ne 0 ]; then
            # Bounded annotations remain readable via the public Checks API.
            # This suite uses public synthetic fixtures only, never private libraries.
            diagnostic=$(tail -n 80 "$RUNNER_TEMP/cvd-tests.log")
            diagnostic=${diagnostic:0:12000}
            diagnostic=${diagnostic//'%'/'%25'}
            diagnostic=${diagnostic//$'\r'/'%0D'}
            diagnostic=${diagnostic//$'\n'/'%0A'}
            printf '::error title=Rust test diagnostic::%s\n' "$diagnostic"
          fi
          exit "$result"
      - name: Frontend unit contracts (browser-free)
        run: bash scripts/node-unit-gate.sh "$RUNNER_TEMP/node-unit"
      - name: Owned process-group + output-path cleanup controls
        run: bash tests/owned-group-control.sh && bash tests/out-guard-control.sh
      - name: Self-contained core app interaction (own host/coordinator/TEST-ONLY fixture wasm, real Chromium; manual only)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          CVD_CHROMIUM="$(command -v chromium || command -v google-chrome)" TMPDIR="$RUNNER_TEMP" \
            bash scripts/core-app-gate.sh "$RUNNER_TEMP/core-app" 1
  image:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          # Native hosted runners only; no QEMU/binfmt, no platform relabeling.
          - arch: amd64
            runner: ubuntu-24.04
            uname: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            uname: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # packages:write is used only by the guarded staging push; fork PRs always
    # receive a read-only token.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Native public-only container build (${{ matrix.arch }})
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          UNAME: ${{ matrix.uname }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$UNAME"
          test "$(docker info -f '{{.Architecture}}')" = "$UNAME"
          docker build --platform "linux/$ARCH" --tag cvd-core:ci \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" .
          test "$(docker image inspect -f '{{.Os}}/{{.Architecture}}' cvd-core:ci)" = "linux/$ARCH"
      - name: Runnable image smoke on native ${{ matrix.arch }} (synthetic, no DB credentials, no plugins)
        shell: bash
        run: |
          set -euo pipefail
          # Image contents: two trusted wasm only, no runner/native libs/plugin wasm.
          docker run --rm --entrypoint sh cvd-core:ci -c '
            set -e; id -u | grep -qx 10001
            test ! -e /usr/local/bin/cvd-indicator-runner
            test -z "$(find / -xdev \( -name "*.so" -path "*/app/*" \) 2>/dev/null)"
            n=$(find /app/static -name "*.wasm" | sort | tr "\n" " ")
            test "$n" = "/app/static/wasm-host/cvd_browser_coordinator.wasm /app/static/wasm-host/cvd_browser_host.wasm "
            cat /app/static/wasm-host/assets.json
            touch /app/data/.w && rm /app/data/.w'
          # Start against a disposable postgres with synthetic data only.
          docker network create cvdsmoke
          docker run -d --name pg --network cvdsmoke -e POSTGRES_USER=cvdadmin -e POSTGRES_DB=cvd -e POSTGRES_PASSWORD=smoke postgres:16
          for i in $(seq 60); do docker exec pg pg_isready -U cvdadmin -d cvd && break; sleep 1; done
          # Legacy [indicators] config must be accepted, ignored and reported.
          printf '[server]\nhttp_addr="0.0.0.0:8080"\nstatic_dir="/app/static"\n[indicators]\nrunner="/usr/local/bin/cvd-indicator-runner"\n[[indicators.library]]\nid="cvd"\npath="/plugins/libcvd_indicator_cvd.so"\n' > "$RUNNER_TEMP/legacy.toml"
          docker run -d --name cvd --network cvdsmoke -p 127.0.0.1:18080:8080 \
            -v "$RUNNER_TEMP/legacy.toml:/app/config.toml:ro" \
            -e DATABASE_URL=postgres://cvdadmin:smoke@pg:5432/cvd cvd-core:ci
          for i in $(seq 60); do curl -fsS http://127.0.0.1:18080/meta >/dev/null && break; sleep 1; done
          docker logs cvd > "$RUNNER_TEMP/cvd-smoke.log" 2>&1
          grep -q "config \[indicators\] is retired and IGNORED" "$RUNNER_TEMP/cvd-smoke.log"
          grep -q "ignored retired indicator library id=cvd" "$RUNNER_TEMP/cvd-smoke.log"
          curl -fsS -o "$RUNNER_TEMP/cvd-root.html" http://127.0.0.1:18080/
          grep -qi "<html" "$RUNNER_TEMP/cvd-root.html"
          curl -fsS http://127.0.0.1:18080/meta | python3 -c 'import json,sys; m=json.load(sys.stdin); assert "indicators" not in m and m["instruments"]'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/indicators)" = 404
          curl -fsS 'http://127.0.0.1:18080/history?exchange=binance&market=spot&symbol=BTC&tf=1m&series=spot-v1&limit=5' | python3 -c 'import json,sys; h=json.load(sys.stdin); assert "indicators" not in h and isinstance(h["invalid_times"], list)'
          # Served assets: exact manifest, wasm bytes+sha256, JS module MIME.
          bash scripts/verify-served-assets.sh http://127.0.0.1:18080
          docker exec cvd test -s /app/data/outbox.sqlite
          docker rm -f cvd pg; docker network rm cvdsmoke
      # Pushes the SAME tested image (no rebuild) to a per-arch staging tag and
      # records its pushed digest; only the publish job creates sha-/latest.
      - name: Stage tested image digest (master push only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'k0Iry/cvd-core'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image=ghcr.io/k0iry/cvd-core
          test "$(docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' cvd-core:ci)" = "$GITHUB_SHA"
          test "$(docker image inspect -f '{{.Os}}/{{.Architecture}}' cvd-core:ci)" = "linux/$ARCH"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tag="$image:stage-$GITHUB_SHA-$ARCH"
          docker tag cvd-core:ci "$tag"
          docker push "$tag" | tee "$RUNNER_TEMP/push.log"
          docker logout ghcr.io
          digest=$(grep -oE 'digest: sha256:[0-9a-f]{64}' "$RUNNER_TEMP/push.log" | tail -n1 | cut -d' ' -f2 || true)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "pushed digest missing" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/digest"
          printf '%s %s %s\n' "$ARCH" "$GITHUB_SHA" "$digest" > "$RUNNER_TEMP/digest/$ARCH"
          echo "- $ARCH: native $(uname -m) build+smoke, $image@$digest" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload digest metadata (tiny text file only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'k0Iry/cvd-core'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1
  # Metadata-only: assembles ONE multi-platform index from BOTH tested digests.
  # Runs only when every matrix leg succeeded (default needs semantics).
  publish:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && github.repository == 'k0Iry/cvd-core'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digest
      - name: Publish multi-arch manifest to GHCR
        shell: bash
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image=ghcr.io/k0iry/cvd-core
          refs=$(bash scripts/check-arch-digests.sh "$RUNNER_TEMP/digest" "$GITHUB_SHA" "$image")
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          # Each tested child must really carry its platform + revision.
          arch_list=(amd64 arm64); i=0
          for ref in $refs; do
            docker buildx imagetools inspect --raw "$ref" \
              | python3 -c 'import json,sys; m=json.load(sys.stdin); assert "config" in m and "manifests" not in m, "child must be a single-platform manifest"'
            docker buildx imagetools inspect "$ref" --format '{{json .Image}}' \
              | python3 -c 'import json,sys; c=json.load(sys.stdin); assert c["os"]=="linux" and c["architecture"]==sys.argv[2], c["architecture"]; assert c["config"]["Labels"]["org.opencontainers.image.revision"]==sys.argv[1]' "$GITHUB_SHA" "${arch_list[$i]}"
            i=$((i+1))
          done
          # shellcheck disable=SC2086
          docker buildx imagetools create --tag "$image:sha-$GITHUB_SHA" $refs
          docker buildx imagetools inspect --raw "$image:sha-$GITHUB_SHA" \
            | python3 -c 'import json,sys; m=json.load(sys.stdin); p=sorted(x["platform"]["os"]+"/"+x["platform"]["architecture"] for x in m["manifests"]); assert p==["linux/amd64","linux/arm64"], p'
          index=$(docker buildx imagetools inspect "$image:sha-$GITHUB_SHA" --format '{{.Manifest.Digest}}')
          # Fail closed: a failed or malformed head lookup never grants :latest.
          head=$(git ls-remote --exit-code "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/master | cut -f1)
          [[ "$head" =~ ^[0-9a-f]{40}$ ]] || { echo "master head lookup invalid" >&2; exit 1; }
          if [ "$head" = "$GITHUB_SHA" ]; then
            docker buildx imagetools create --tag "$image:latest" "$image@$index"
            latest="$image:latest (published)"
          else
            latest="NOT updated: superseded by master $head"
          fi
          docker logout ghcr.io
          {
            echo "### Published image"
            echo "- commit: $GITHUB_SHA"
            echo "- sha tag: $image:sha-$GITHUB_SHA ($index)"
            echo "- latest: $latest"
            echo "- platforms: linux/amd64 + linux/arm64, each natively built and smoked"
            for ref in $refs; do echo "- child: $ref"; done
          } | tee -a "$GITHUB_STEP_SUMMARY"
