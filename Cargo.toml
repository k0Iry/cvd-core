[workspace]
resolver = "2"
members = [
    "crates/indicator-sdk",
    "crates/cvd-server",
    "crates/browser-host",
    "tests/fixtures/wasm/hostile-plugin",
    "tests/fixtures/wasm/stateful-plugin",
    "tests/fixtures/plugins/sample-indicator",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
publish = false
license = "Apache-2.0"
rust-version = "1.96"

[profile.release]
panic = "unwind"

# Browser WASM plugin/host builds: panic aborts (trap) on wasm32 only; native
# server/native test builds keep `release` (panic = "unwind").
[profile.wasm-release]
inherits = "release"
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
